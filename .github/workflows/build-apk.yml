{"name":"Build Melodia APK","on":{"push":{"branches":["main"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-java@v4","with":{"distribution":"temurin","java-version":"17"}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.7"}},{"name":"Build","run":"gradle --no-daemon assembleRelease -Pandroid.injected.build.abi=arm64-v8a"},{"name":"Rename","run":"find app/build -name '*.apk'; cp $(find app/build -name '*release*.apk' | head -1) melodia.apk"},{"uses":"actions/upload-artifact@v4","with":{"name":"melodia","path":"melodia.apk"}},{"name":"Release","env":{"GH_TOKEN":"${{ github.token }}"},"run":"gh release delete latest --yes --cleanup-tag || true; gh release create latest melodia.apk --title Melodia --notes 'Ultima versione di Melodia' --latest"}]}}}
